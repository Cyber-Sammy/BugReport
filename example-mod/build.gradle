plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.cybersammy.bugreport.example'
version = providers.gradleProperty('mod_version').get()

base {
    archivesName = 'bugreport-example-mod'
}

neoForge {
    version = providers.gradleProperty('neo_version').get()
    mods {
        bugreport_example {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    jarJar(implementation("${providers.gradleProperty('api_group').get()}:${providers.gradleProperty('api_artifact').get()}:0.2.0")) {
        version {
            strictly '[0.2.0,1.0.0)'
            prefer '0.2.0'
        }
    }
}

configurations.named('jarJar') {
    // Preserve the tested API compatibility range in NeoForge Jar-in-Jar
    // metadata; compile and runtime classpaths remain dependency-locked.
    resolutionStrategy.deactivateDependencyLocking()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Automatic-Module-Name': 'com.cybersammy.bugreport.example'
    }
}
