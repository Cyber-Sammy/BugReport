plugins {
    id 'java-library'
}

group = providers.gradleProperty('api_group').get()
version = providers.gradleProperty('mod_version').get()

base {
    archivesName = 'bugreport-core'
}

dependencies {
    compileOnly project(':bugreport-api')
    implementation "com.google.code.gson:gson:${providers.gradleProperty('gson_version').get()}"

    testImplementation project(':bugreport-api')
    testImplementation "org.junit.jupiter:junit-jupiter:${providers.gradleProperty('junit_version').get()}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${providers.gradleProperty('junit_platform_version').get()}"
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.cybersammy.bugreport.core',
                'Implementation-Title': 'Bug Report Core',
                'Implementation-Version': project.version
        )
    }
}

tasks.register('m3LifecycleSmoke', Test) {
    group = 'verification'
    description = 'Runs the exact Core lifecycle from reviewed data through a verified local ZIP.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching(
                'com.cybersammy.bugreport.core.workspace.HeadlessReportLifecycleHarnessTest'
                        + '.producesReviewedSanitizedZipThroughExplicitLocalExport')
    }
}
