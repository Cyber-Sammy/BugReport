plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = providers.gradleProperty('neo_version').get()

    runs {
        providerOnly {
            server()
            gameDirectory = rootProject.layout.buildDirectory.dir(
                    'spike-runtime/provider-only').get().asFile
            programArgument '--nogui'
        }

        bugReportOnly {
            server()
            gameDirectory = rootProject.layout.buildDirectory.dir(
                    'spike-runtime/bugreport-only').get().asFile
            programArgument '--nogui'
        }

        compatible {
            server()
            gameDirectory = rootProject.layout.buildDirectory.dir(
                    'spike-runtime/compatible').get().asFile
            programArgument '--nogui'
        }

        incompatible {
            server()
            gameDirectory = rootProject.layout.buildDirectory.dir(
                    'spike-runtime/incompatible').get().asFile
            programArgument '--nogui'
        }
    }
}

tasks.named('runProviderOnly') {
    dependsOn rootProject.tasks.named('prepareProviderOnly')
}

tasks.named('runBugReportOnly') {
    dependsOn rootProject.tasks.named('prepareBugReportOnly')
}

tasks.named('runCompatible') {
    dependsOn rootProject.tasks.named('prepareCompatible')
}

tasks.named('runIncompatible') {
    dependsOn rootProject.tasks.named('prepareIncompatible')
}
