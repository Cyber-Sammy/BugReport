tasks.register('verifyProviderDiscoverySpike') {
    group = 'verification'
    description = 'Compares service and NeoForge metadata provider discovery.'
    dependsOn ':spike-runtime:runDiscoveryComparison'

    doLast {
        def marker = layout.buildDirectory.file(
                'spike-runtime/discovery-comparison/bugreport-discovery.marker')
                .get().asFile
        if (!marker.isFile()) {
            throw new GradleException("Missing provider discovery marker: ${marker}")
        }

        def markerData = marker.readLines('UTF-8').collectEntries { line ->
            int separator = line.indexOf('=')
            if (separator < 1) {
                throw new GradleException(
                        "Malformed provider discovery marker line: ${line}")
            }
            [(line.substring(0, separator)): line.substring(separator + 1)]
        }
        def expectedServiceFailures = [
                'descriptor:service',
                'duplicate:bugreport_provider_a',
                'load:com.cybersammy.bugreport.fixtures.providerb.ThrowingProvider'
        ].join(',')
        def expectedMetadataFailures = [
                'access:com.cybersammy.bugreport.fixtures.providerb.PackagePrivateProvider',
                'constructor:com.cybersammy.bugreport.fixtures.providerb.NoPublicConstructorProvider',
                'duplicate:bugreport_provider_a',
                'duplicate:bugreport_provider_b:duplicate',
                'invalid:com.cybersammy.bugreport.fixtures.providerb.NotAProvider',
                'load:com.cybersammy.bugreport.fixtures.providerb.ThrowingProvider',
                'missing:com.cybersammy.bugreport.fixtures.providerb.MissingProvider',
                'ownership:com.cybersammy.bugreport.fixtures.providera.ProviderAMod'
        ].join(',')
        def expectations = [
                phase: 'STARTED',
                decision: 'mod_metadata',
                serviceProviders: 'bugreport_provider_b',
                serviceFailures: expectedServiceFailures,
                metadataProviders: [
                        'bugreport_provider_b',
                        'bugreport_provider_b:disabled',
                        'bugreport_provider_b:partial'
                ].join(','),
                metadataFailures: expectedMetadataFailures,
                api: '0.2.0',
                apiLoader: 'cpw.mods.cl.ModuleClassLoader',
                metadataLoaders: 'cpw.mods.modlauncher.TransformingClassLoader',
                metadataLoadersShareApiIdentity: 'false',
                metadataModules: [
                        'bugreport_provider_a',
                        'bugreport_provider_b'
                ].join(',')
        ]
        expectations.each { key, expected ->
            if (markerData[key] != expected) {
                throw new GradleException(
                        "Unexpected discovery result ${key}=${markerData[key]}, "
                                + "expected ${expected}")
            }
        }
    }
}

tasks.register('verifyJarJarMetadata') {
    group = 'verification'
    description = 'Validates API artifact isolation and Jar-in-Jar negotiation metadata.'
    dependsOn tasks.named('buildSpikeArtifacts')

    doLast {
        def apiJar = project(':bugreport-api').tasks.named('jar').get().archiveFile.get().asFile
        def apiArchive = new java.util.jar.JarFile(apiJar)
        try {
            def moduleName = apiArchive.manifest.mainAttributes.getValue('Automatic-Module-Name')
            if (moduleName != 'com.cybersammy.bugreport.api') {
                throw new GradleException("Unexpected API module name: ${moduleName}")
            }
            def forbiddenEntries = apiArchive.entries().findAll {
                it.name.startsWith('net/neoforged/')
                        || it.name.startsWith('com/cybersammy/bugreport/neoforge/')
                        || it.name == 'com/cybersammy/bugreport/api/ApiRuntime.class'
            }
            if (!forbiddenEntries.isEmpty()) {
                throw new GradleException(
                        "The standalone API JAR contains forbidden classes: ${forbiddenEntries}")
            }
        } finally {
            apiArchive.close()
        }

        def productionModJar =
                project(':bugreport-neoforge').tasks.named('jar').get().archiveFile.get().asFile
        def productionModArchive = new java.util.zip.ZipFile(productionModJar)
        try {
            def fixtureEntries = productionModArchive.entries().findAll {
                it.name.startsWith('com/cybersammy/bugreport/fixtures/')
            }
            if (!fixtureEntries.isEmpty()) {
                throw new GradleException(
                        "The production mod JAR contains test fixtures: ${fixtureEntries}")
            }
        } finally {
            productionModArchive.close()
        }

        def expectations = [
                [project: project(':bugreport-neoforge'), range: '[0.1.0,1.0.0)',
                 version: currentApiVersion],
                [project: project(':example-mod'), range: '[0.3.0,1.0.0)',
                 version: currentApiVersion],
                [project: project(':spike-fixtures:provider-a'), range: '[0.1.0,1.0.0)',
                 version: '0.1.0'],
                [project: project(':spike-fixtures:provider-b'), range: '[0.2.0,1.0.0)',
                 version: '0.2.0'],
                [project: project(':spike-fixtures:provider-incompatible'),
                 range: '[1.0.0,2.0.0)', version: '1.0.0']
        ]

        expectations.each { expectation ->
            def archiveFile =
                    expectation.project.tasks.named('jar').get().archiveFile.get().asFile
            def archive = new java.util.zip.ZipFile(archiveFile)
            try {
                def metadataEntry = archive.getEntry('META-INF/jarjar/metadata.json')
                if (metadataEntry == null) {
                    throw new GradleException("Missing Jar-in-Jar metadata in ${archiveFile}")
                }
                def metadata = new groovy.json.JsonSlurper().parse(
                        archive.getInputStream(metadataEntry))
                if (metadata.jars.size() != 1) {
                    throw new GradleException(
                            "Expected one embedded API in ${archiveFile}: ${metadata}")
                }
                def embedded = metadata.jars[0]
                if (embedded.identifier.group !=
                        providers.gradleProperty('api_group').get()
                        || embedded.identifier.artifact !=
                        providers.gradleProperty('api_artifact').get()
                        || embedded.version.range != expectation.range
                        || embedded.version.artifactVersion != expectation.version) {
                    throw new GradleException(
                            "Unexpected Jar-in-Jar metadata in ${archiveFile}: ${embedded}")
                }
                if (archive.getEntry(embedded.path) == null) {
                    throw new GradleException(
                            "Embedded API path is absent in ${archiveFile}: ${embedded.path}")
                }
            } finally {
                archive.close()
            }
        }
    }
}

