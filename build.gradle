subprojects {
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
            options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        tasks.withType(Jar).configureEach {
            from(rootProject.file('LICENSE')) {
                into 'META-INF'
            }
        }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

configure(productionProjectPaths.collect { project(it) }) {
    dependencyLocking {
        lockAllConfigurations()
    }

    configurations.configureEach {
        if (name == 'neoFormRuntimeDependenciesRuntimeClasspath') {
            // ModDev adds OS-specific native artifacts to this tooling
            // configuration. A lock generated on one OS is invalid on another.
            resolutionStrategy.deactivateDependencyLocking()
        }
    }
}

