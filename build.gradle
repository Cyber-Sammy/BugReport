def verifyDiscoveryLog = { String taskName, String prerequisite,
                           String scenarioDirectory, String providers,
                           List<String> diagnosticFragments ->
    tasks.register(taskName) {
        group = 'verification'
        dependsOn prerequisite

        doLast {
            def latestLog = layout.buildDirectory.file(
                    "spike-runtime/${scenarioDirectory}/logs/latest.log").get().asFile
            if (!latestLog.isFile()) {
                throw new GradleException("Missing discovery runtime log: ${latestLog}")
            }
            def discoveryLine = latestLog.readLines('UTF-8').find {
                it.contains('Bug Report provider discovery completed:')
            }
            if (discoveryLine == null) {
                throw new GradleException(
                        "Bug Report did not complete provider discovery in ${latestLog}")
            }
            if (!discoveryLine.contains("providers=${providers}")) {
                throw new GradleException(
                        "Unexpected discovered providers in ${latestLog}: ${discoveryLine}")
            }
            diagnosticFragments.each { fragment ->
                if (!discoveryLine.contains(fragment)) {
                    throw new GradleException(
                            "Missing discovery diagnostic '${fragment}' in ${latestLog}")
                }
            }
        }
    }
}

