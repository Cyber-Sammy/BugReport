def verifyMarker = { String taskName, String scenarioDirectory, List<String> roles,
                     String expectedVersion, List<String> expectedProviderVersions ->
    tasks.register(taskName) {
        group = 'verification'
        dependsOn ":spike-runtime:run${taskName - 'verify'}"
        doLast {
            def marker = layout.buildDirectory.file(
                    "spike-runtime/${scenarioDirectory}/bugreport-spike.marker").get().asFile
            if (!marker.isFile()) {
                throw new GradleException("Missing runtime marker: ${marker}")
            }

            def markerData = marker.readLines('UTF-8').collectEntries { line ->
                int separator = line.indexOf('=')
                if (separator < 1) {
                    throw new GradleException(
                            "Malformed runtime marker line in ${marker}: ${line}")
                }
                [(line.substring(0, separator)): line.substring(separator + 1)]
            }
            if (markerData.phase != 'STARTED') {
                throw new GradleException(
                        "Scenario ${scenarioDirectory} did not reach server start: ${markerData}")
            }
            def observedRoles = markerData.roles ? markerData.roles.split(',').toList() : []
            if (observedRoles != roles.sort()) {
                throw new GradleException(
                        "Scenario ${scenarioDirectory} loaded unexpected roles: ${observedRoles}")
            }
            if (markerData.api != expectedVersion) {
                throw new GradleException(
                        "Scenario ${scenarioDirectory} selected API ${markerData.api}, "
                                + "expected ${expectedVersion}")
            }
            def observedProviderVersions = markerData.providerVersions
                    ? markerData.providerVersions.split(',').toList()
                    : []
            if (observedProviderVersions != expectedProviderVersions.sort()) {
                throw new GradleException(
                        "Scenario ${scenarioDirectory} observed unexpected provider versions: "
                                + observedProviderVersions)
            }
            if (!markerData.source?.contains("bugreport-api-${expectedVersion}.jar")) {
                throw new GradleException(
                        "Scenario ${scenarioDirectory} selected an unexpected API source")
            }
            if (!markerData.loader) {
                throw new GradleException(
                        "Scenario ${scenarioDirectory} did not report the API class loader")
            }
        }
    }
}

