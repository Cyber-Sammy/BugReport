tasks.register('verifyIncompatible') {
    group = 'verification'
    description = 'Verifies that incompatible embedded API ranges fail deterministically.'
    dependsOn ':spike-runtime:runIncompatible'

    doLast {
        def gameDirectory =
                layout.buildDirectory.dir('spike-runtime/incompatible').get().asFile
        def latestLog = new File(gameDirectory, 'logs/latest.log')
        if (!latestLog.isFile()) {
            throw new GradleException("Missing incompatible scenario log: ${latestLog}")
        }

        def logText = latestLog.getText('UTF-8')
        def expectedFragments = [
                'conflicting versions of: com.cybersammy.bugreport:bugreport-api',
                "bugreport - [0.1.0,1.0.0) - ${currentApiVersion}",
                'bugreport_provider_incompatible - [1.0.0,2.0.0) - 1.0.0'
        ]
        expectedFragments.each { fragment ->
            if (!logText.contains(fragment)) {
                throw new GradleException(
                        "Missing expected conflict detail '${fragment}' in ${latestLog}")
            }
        }

        def marker = layout.buildDirectory.file(
                'spike-runtime/incompatible/bugreport-spike.marker').get().asFile
        if (marker.exists()) {
            throw new GradleException(
                    "Incompatible providers reached mod construction unexpectedly: ${marker}")
        }
    }
}

