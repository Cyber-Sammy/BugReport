plugins {
    id 'java-library'
}

group = providers.gradleProperty('api_group').get()
version = providers.gradleProperty('mod_version').get()

base {
    archivesName = 'bugreport-testkit'
}

dependencies {
    api project(':bugreport-api')
    implementation project(':bugreport-core')

    testImplementation "org.junit.jupiter:junit-jupiter:${providers.gradleProperty('junit_version').get()}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${providers.gradleProperty('junit_platform_version').get()}"
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.cybersammy.bugreport.testkit',
                'Implementation-Title': 'Bug Report Testkit',
                'Implementation-Version': project.version
        )
    }
}
