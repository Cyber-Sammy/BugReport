plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('api_group').get()
version = providers.gradleProperty('api_version').get()

base {
    archivesName = providers.gradleProperty('api_artifact').get()
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${providers.gradleProperty('junit_version').get()}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${providers.gradleProperty('junit_platform_version').get()}"
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.cybersammy.bugreport.api',
                'Implementation-Title': 'Bug Report API',
                'Implementation-Version': project.version
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = providers.gradleProperty('api_artifact').get()
            pom {
                name = 'Bug Report API'
                description = 'Loader-neutral integration contracts for Bug Report providers.'
                url = 'https://github.com/Cyber-Sammy/BugReport'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Cyber-Sammy/BugReport.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Cyber-Sammy/BugReport.git'
                    url = 'https://github.com/Cyber-Sammy/BugReport'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'spike'
            url = rootProject.layout.buildDirectory.dir('spike-maven')
        }
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('local-maven')
        }
    }
}

def publishedGroup = providers.gradleProperty('api_group').get()
def publishedArtifact = providers.gradleProperty('api_artifact').get()
def publishedVersion = version.toString()
def publicationCoordinatePath = [
        publishedGroup.replace('.', '/'),
        publishedArtifact,
        publishedVersion
].join('/')
def localPublicationDirectory =
        rootProject.layout.buildDirectory.dir(
                "local-maven/${publicationCoordinatePath}")

tasks.register('verifyLocalPublication') {
    group = 'verification'
    description = 'Publishes and verifies the API in the isolated local Maven repository.'
    dependsOn tasks.named('publishMavenJavaPublicationToLocalRepository')

    doLast {
        def publicationDirectory = localPublicationDirectory.get().asFile
        def expectedFiles = [
                "${publishedArtifact}-${publishedVersion}.jar",
                "${publishedArtifact}-${publishedVersion}-sources.jar",
                "${publishedArtifact}-${publishedVersion}-javadoc.jar",
                "${publishedArtifact}-${publishedVersion}.pom"
        ]
        def missing = expectedFiles.findAll {
            !new File(publicationDirectory, it).isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Local API publication is incomplete in ${publicationDirectory}: ${missing}")
        }

        def pom = new groovy.xml.XmlSlurper()
                .parse(new File(
                        publicationDirectory,
                        "${publishedArtifact}-${publishedVersion}.pom"))
        if (pom.groupId.text() != publishedGroup
                || pom.artifactId.text() != publishedArtifact
                || pom.version.text() != publishedVersion
                || pom.licenses.license.name.text() != 'Apache License, Version 2.0') {
            throw new GradleException("Unexpected local API POM metadata: ${pom}")
        }
    }
}
