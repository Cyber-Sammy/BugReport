plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.cybersammy.bugreport'
version = '0.0.1-spike'

base {
    archivesName = 'bugreport-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = providers.gradleProperty('neo_version').get()
    mods {
        bugreport {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    jarJar(implementation("${providers.gradleProperty('api_group').get()}:${providers.gradleProperty('api_artifact').get()}:0.2.0")) {
        version {
            strictly '[0.1.0,1.0.0)'
            prefer '0.2.0'
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Automatic-Module-Name': 'com.cybersammy.bugreport.neoforge'
    }
}
