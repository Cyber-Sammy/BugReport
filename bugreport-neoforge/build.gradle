plugins {
    id 'net.neoforged.moddev'
}

group = 'com.cybersammy.bugreport'
version = providers.gradleProperty('mod_version').get()

base {
    archivesName = 'bugreport-neoforge'
}

sourceSets {
    client {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations.named('clientImplementation') {
    extendsFrom configurations.implementation
}

neoForge {
    version = providers.gradleProperty('neo_version').get()
    addModdingDependenciesTo sourceSets.client
    mods {
        bugreport {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    implementation project(':bugreport-core')
    jarJar(implementation("${providers.gradleProperty('api_group').get()}:${providers.gradleProperty('api_artifact').get()}:${providers.gradleProperty('api_version').get()}")) {
        version {
            strictly '[0.1.0,1.0.0)'
            prefer providers.gradleProperty('api_version').get()
        }
    }
    testImplementation "com.google.code.gson:gson:${providers.gradleProperty('gson_version').get()}"
    testImplementation "org.junit.jupiter:junit-jupiter:${providers.gradleProperty('junit_version').get()}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${providers.gradleProperty('junit_platform_version').get()}"
}

configurations.named('jarJar') {
    // A dependency lock is an exact local resolution constraint. Applying it to
    // Jar-in-Jar would replace the advertised compatibility range in metadata.
    resolutionStrategy.deactivateDependencyLocking()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

def coreProject = project(':bugreport-core')

tasks.named('jar', Jar) {
    dependsOn coreProject.tasks.named('classes')
    from(coreProject.sourceSets.main.output)
    from(sourceSets.client.output)

    manifest {
        attributes 'Automatic-Module-Name': 'com.cybersammy.bugreport.neoforge'
    }
}

tasks.register('m3ApplicationLifecycleSmoke', Test) {
    group = 'verification'
    description = 'Runs the NeoForge application authority chain through retry and local ZIP export.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching(
                'com.cybersammy.bugreport.neoforge.command.BugReportCommandServiceTest'
                        + '.advancesOnlyServiceIssuedSanitizationAndReviewAuthorityToReady')
    }
}
